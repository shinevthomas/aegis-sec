name: "AegisSec: DevSecOps Quality Gate"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: "Automated ASPM Security Gate"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Execute AegisSec Scanner (OASIS SARIF)"
        run: |
          python3 engine/scanner.py target_app --format sarif --output aegis-results.sarif

      - name: "Enforce Security Quality Gate (Threshold: 80/100)"
        run: |
          python3 engine/scanner.py target_app --format table --threshold 80

      - name: "Upload SARIF to GitHub Security Tab"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: aegis-results.sarif
          category: aegis-sec-aspm

      - name: "Archive Security Audit Report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegis-security-report
          path: engine/scan_report.json
